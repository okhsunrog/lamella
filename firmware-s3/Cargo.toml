[package]
edition = "2024"
name = "firmware-s3"
rust-version = "1.95"
version = "0.1.0"
authors = ["Danila Gornushko"]
license = "MIT OR Apache-2.0"

[[bin]]
name = "firmware"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { git = "https://github.com/esp-rs/esp-hal", rev = "6713fbd7391691098d7229d9950c8391f1b50a94", features = ["esp32s3", "log-04", "unstable"] }

esp-rtos = { git = "https://github.com/esp-rs/esp-hal", rev = "6713fbd7391691098d7229d9950c8391f1b50a94", features = [
    "embassy",
    "esp-alloc",
    "esp-radio",
    "esp32s3",
    "log-04",
] }

esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal", rev = "6713fbd7391691098d7229d9950c8391f1b50a94", features = ["esp32s3", "log-04"] }
log = "0.4"

esp-alloc = { git = "https://github.com/esp-rs/esp-hal", rev = "6713fbd7391691098d7229d9950c8391f1b50a94" }
esp-backtrace = { git = "https://github.com/esp-rs/esp-hal", rev = "6713fbd7391691098d7229d9950c8391f1b50a94", features = [
    "esp32s3",
    "panic-handler",
    "println",
] }
esp-println = { git = "https://github.com/esp-rs/esp-hal", rev = "6713fbd7391691098d7229d9950c8391f1b50a94", features = ["esp32s3", "log-04"] }

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.1", features = ["log"] }
embassy-usb = { version = "0.6.0", default-features = false }
embassy-futures = "0.1"

esp-radio = { git = "https://github.com/esp-rs/esp-hal", rev = "6713fbd7391691098d7229d9950c8391f1b50a94", features = [
    "esp-alloc",
    "esp32s3",
    "log-04",
    "unstable",
    "wifi",
] }

# Ergot and related
ergot = { git = "https://github.com/jamesmunns/ergot", rev = "5a5fab8234339ecdc252e18c41ef2676bd6bb091", features = [
    "embassy-usb-v0_6",
] }
bbqueue = { version = "0.7", default-features = false, features = ["maitake-sync-0_3", "critical-section"] }
mutex = { version = "1.0", features = ["impl-critical-section"] }

# ICD
icd = { path = "../icd" }

critical-section = "1.2.0"
static_cell = "2.1.1"
heapless = "0.9.2"
embassy-net-driver = "0.2.0"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
